<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조선 통치 체제 퀴즈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f1f3f6; --text:#15171c; --muted:#6b7280; --line:#e4e7ec;
  --accent:#3451d1; --accent-ink:#ffffff; --accent-soft:#eaeefd;
  --ok:#0f7a55; --ok-soft:#e2f4ec; --bad:#cf3434; --bad-soft:#fdeaea;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 10px 30px rgba(16,24,40,.07);
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1014; --surface:#171a21; --surface-2:#1e222b; --text:#eceef2; --muted:#98a1b0; --line:#2a2f3a;
    --accent:#7d97ff; --accent-ink:#0e1014; --accent-soft:#1d2747;
    --ok:#52d1a3; --ok-soft:#12302a; --bad:#ff8080; --bad-soft:#3a1c1f;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 64px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{font-size:22px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin-bottom:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
[hidden]{display:none!important}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);
  font:inherit;font-weight:700;font-size:15px;padding:12px 20px;border-radius:12px;cursor:pointer;
  transition:transform .08s ease, background .15s ease, border-color .15s ease}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:default}

/* intro */
.intro h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
.intro p.lead{color:var(--muted);margin:0 0 22px}
.rules{list-style:none;padding:0;margin:0 0 26px;display:grid;gap:10px}
.rules li{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:15px}
.rules b{color:var(--accent)}
.rules .ic{flex:none;width:24px;height:24px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:13px;font-weight:800}

/* progress */
.progress{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s ease}
.progress span{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}

/* question */
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.qcount{font-size:14px;font-weight:800;color:var(--accent)}
.qcount em{font-style:normal;color:var(--muted);font-weight:600}
.qtag{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:4px 10px;border-radius:99px}
.qbody{font-size:19px;line-height:2.25;word-break:keep-all;letter-spacing:-.01em}
.qtitle{font-size:19px;font-weight:700;margin:0 0 18px}
.blank{
  font:inherit;font-size:17px;color:var(--text);background:var(--accent-soft);
  border:none;border-bottom:2px solid var(--accent);border-radius:8px 8px 4px 4px;
  padding:4px 10px;margin:0 3px;min-width:4em;max-width:100%;vertical-align:baseline;outline:none;
  transition:background .15s ease, box-shadow .15s ease;
}
.blank:focus{background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.blank.long{display:block;width:100%;margin:8px 0;line-height:1.6;padding:10px 12px}
.card.anim{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* chart */
.chart{display:flex;flex-direction:column;align-items:center}
.stem{width:2px;height:18px;background:var(--line)}
.branches{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;margin-top:0;padding-top:16px;border-top:2px solid var(--line)}
.branch{background:var(--surface-2);border-radius:14px;padding:14px}
.branch .cap{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;text-align:center}
.col{display:flex;flex-direction:column;align-items:center}
.grid{display:grid;gap:8px;width:100%}
.grid.six{grid-template-columns:repeat(3,1fr)}
.grid.eight{grid-template-columns:repeat(2,1fr)}
.chart .blank{display:block;width:100%;margin:0;text-align:center;font-size:16px;padding:8px 6px;min-width:0}
.chart .node{width:min(200px,100%)}
.chart .root{width:min(200px,70%)}
.chart .root .blank,.chart .node .blank{font-weight:700}

/* nav */
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;align-items:center}
.dot{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;padding:0}
.dot.filled{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.dots .spacer{flex:1}
.dots .btn{padding:8px 16px;font-size:14px}

/* result */
.score{display:flex;align-items:center;gap:24px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800;letter-spacing:-.03em}
.ring .num small{font-size:14px;font-weight:700;color:var(--muted);margin-left:2px}
.score h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.score p{margin:0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.tabs{display:flex;gap:6px;margin:26px 0 14px}
.tab{font:inherit;font-size:14px;font-weight:700;border:none;background:transparent;color:var(--muted);padding:8px 14px;border-radius:99px;cursor:pointer}
.tab.on{background:var(--text);color:var(--surface)}
.rlist{display:grid;gap:14px}
.ritem{padding:22px}
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.badge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.rnum{font-weight:800}
.rbody{font-size:16px;line-height:2;word-break:keep-all}
.ans{display:inline;padding:2px 8px;border-radius:6px;font-weight:700;margin:0 2px}
.ans.ok{background:var(--ok-soft);color:var(--ok)}
.ans.bad{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.ans.empty{font-style:italic;font-weight:600}
.fix{display:inline;padding:2px 8px;border-radius:6px;font-weight:700;color:var(--ok);border:1.5px dashed var(--ok);margin:0 2px}
.chip{display:block;text-align:center;padding:6px 6px;border-radius:8px;font-weight:700;font-size:14px;line-height:1.4}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip .exp{display:block;font-size:12px;color:var(--ok);font-weight:700}
.missing{margin-top:10px;font-size:14px;color:var(--bad);font-weight:600}
details.exp{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.exp summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent);list-style:none}
details.exp summary::-webkit-details-marker{display:none}
details.exp summary::before{content:"▸ ";}
details.exp[open] summary::before{content:"▾ ";}
.expbody{font-size:15px;color:var(--text);margin-top:8px}
.expbody p{margin:0 0 8px}
.expbody ul{margin:4px 0 8px;padding-left:18px}
.expbody li{margin:2px 0}
.expbody b{color:var(--accent)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--text);color:var(--surface);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;
  transition:all .25s ease;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
  .card{padding:20px}
  .qbody{font-size:17px;line-height:2.2}
  .branches{grid-template-columns:1fr}
  .score{flex-direction:column;align-items:flex-start;gap:14px}
  .grid.six{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand"><small>한국사 · 빈칸 채우기</small>조선의 건국과 통치 체제</div>
  </header>

  <!-- 시작 화면 -->
  <section id="intro" class="card intro">
    <h1>빈칸을 채워 보세요</h1>
    <p class="lead">총 15문항이 무작위 순서로 한 문제씩 나옵니다.</p>
    <ul class="rules">
      <li><span class="ic">1</span><span>모든 빈칸을 채운 뒤 <b>제출</b>하면 점수와 문항별 해설이 나옵니다.</span></li>
      <li><span class="ic">2</span><span><b>띄어쓰기와 문장부호</b>(마침표·쉼표·가운뎃점)는 채점에 영향을 주지 않습니다.</span></li>
      <li><span class="ic">3</span><span>단어나 조사가 <b>하나라도 빠지면 오답</b>입니다.</span></li>
      <li><span class="ic">4</span><span>15번 조직도는 같은 칸 묶음 안에서 <b>순서와 관계없이</b> 채점합니다.</span></li>
    </ul>
    <button class="btn primary" id="startBtn">시작하기</button>
  </section>

  <!-- 풀이 화면 -->
  <section id="quiz" hidden>
    <div class="progress"><div class="bar"><i id="barFill"></i></div><span id="progText">0 / 15 작성</span></div>
    <div class="card" id="qcard"></div>
    <div class="dots" id="dots"></div>
  </section>

  <!-- 결과 화면 -->
  <section id="result" hidden>
    <div class="card">
      <div class="score">
        <div class="ring">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/>
            <circle id="ringArc" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="326.73" style="transition:stroke-dashoffset .8s ease"/>
          </svg>
          <div class="num"><span id="scoreNum">0</span><small>점</small></div>
        </div>
        <div>
          <h2 id="scoreTitle"></h2>
          <p id="scoreSub"></p>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="retryAll">처음부터 다시 풀기</button>
        <button class="btn" id="retryWrong">틀린 문제만 다시 풀기</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" data-f="all">전체</button>
      <button class="tab" data-f="bad">오답만</button>
    </div>
    <div class="rlist" id="rlist"></div>
  </section>
</main>
<div id="toast"></div>

<script>
/* =========================================================
   문제 데이터 — {{정답}} 부분이 빈칸이 됩니다.
   {{정답|다른정답}} 처럼 | 로 대체 정답을 추가할 수 있습니다.
   ========================================================= */
const QUESTIONS = [
{ n:1,
  text:"우왕과 최영이 {{요동 정벌}}을 추진하였으나, 정벌에 반대하던 이성계가 압록강의 {{위화도}}에서 군대를 돌려 우왕과 최영을 몰아내고 국정을 장악하였다.",
  exp:`<p>1388년 명이 철령 이북의 땅을 요구하자, 우왕과 최영은 이에 맞서 <b>요동 정벌</b>을 추진하였다.</p>
<p>이성계는 이른바 '4불가론'을 내세워 반대하였다.</p>
<ul><li>작은 나라가 큰 나라를 거스르는 것은 옳지 않다</li><li>여름철에 군사를 동원하는 것은 옳지 않다</li><li>온 나라가 원정에 나서면 왜구가 그 틈을 노린다</li><li>장마철이라 활의 아교가 녹고 전염병이 돌 우려가 있다</li></ul>
<p>결국 압록강 하류의 섬 <b>위화도</b>에서 군대를 돌려(위화도 회군) 우왕과 최영을 몰아내고 정치·군사적 실권을 장악하였다. 이는 조선 건국의 결정적 계기가 되었다.</p>` },

{ n:2,
  text:"과전법은 {{경기 지역}}의 토지를 {{전·현직 관리}}에게 등급에 따라 {{수조권}}을 나누어 준 제도이다.",
  exp:`<p>1391년(공양왕 3년) 이성계와 신진 사대부가 권문세족의 대농장을 정리하고, 국가 재정과 신진 관료의 경제 기반을 마련하기 위해 실시하였다.</p>
<ul><li><b>경기 지역</b>: 지급 범위를 경기로 한정하여 국가가 통제하기 쉽게 하였다.</li>
<li><b>전·현직 관리</b>: 관직에서 물러난 관리까지 포함하여 18과로 등급을 나누어 지급하였다.</li>
<li><b>수조권</b>: 토지의 소유권이 아니라 그 토지에서 조세를 거둘 수 있는 권리이다.</li></ul>
<p>원칙적으로 세습이 불가능했지만, 수신전·휼양전 등의 명목으로 일부 세습되기도 하였다.</p>` },

{ n:3,
  text:"조선은 성리학적 유교 질서에 따라 백성을 나라의 근본으로 하는 {{민본}}사상을 내세웠으며, 국왕이 {{왕도 정치}}를 추구할 것을 강조하였다.",
  exp:`<p><b>민본 사상</b>은 '백성이 나라의 근본'이라는 유교의 정치사상으로, 조선 건국의 핵심 통치 이념이다.</p>
<p><b>왕도 정치</b>는 국왕이 힘과 형벌(패도)이 아니라 덕과 예로써 백성을 다스려야 한다는 이상 정치이다. 정도전 등 건국 주도 세력은 이를 바탕으로 국가 체제를 설계하였다.</p>` },

{ n:4,
  text:"유교 통치 이념에 따라 건설된 한양은 경복궁을 중심으로 왼쪽에는 {{종묘}}를 두고 오른쪽에는 {{사직단}}을 세웠다.",
  exp:`<p>유교 경전 『주례』의 <b>'좌묘우사(左廟右社)'</b> 원칙에 따른 배치이다. 궁궐에서 왕이 남쪽을 바라볼 때를 기준으로 왼쪽(동쪽)에 종묘, 오른쪽(서쪽)에 사직단을 두었다.</p>
<ul><li><b>종묘</b>: 역대 왕과 왕비의 신주를 모시고 제사를 지내는 사당 — 왕실의 정통성을 상징한다.</li>
<li><b>사직단</b>: 토지의 신(社)과 곡식의 신(稷)에게 제사를 지내는 곳 — 농업 국가로서 백성의 삶을 중시함을 상징한다.</li></ul>` },

{ n:5,
  text:"태종은 {{6조|육조}}에서 나랏일을 국왕에게 직접 보고하게 하여 {{의정부}}의 기능을 약화하고 국왕 중심의 정치를 강화하였다.",
  exp:`<p>이를 <b>6조 직계제</b>라고 한다. 6조의 판서가 의정부를 거치지 않고 국왕에게 직접 보고하고 결재를 받게 하여, 재상들의 합의 기구인 <b>의정부</b>의 권한을 줄이고 왕권을 강화하였다.</p>
<p>태종은 이 밖에도 사병 혁파, 호패법 실시 등으로 왕권과 국가 기반을 다졌다. (비교: 세종은 <b>의정부 서사제</b>를 실시해 재상의 역할을 다시 키웠다.)</p>` },

{ n:6,
  text:"태종은 호구 조사와 호패법을 실시하여 {{인구를 파악하고 세금 징수와 군역 부과의 기초 자료를 마련하고자 하였다.}}",
  exp:`<p><b>호패</b>는 16세 이상 남자에게 발급한 일종의 신분증으로, 이름·나이·신분 등이 적혀 있었다.</p>
<p>호구 조사(호적 작성)와 호패법을 통해 국가는 인구를 정확히 파악하고, 이를 바탕으로 <b>세금 징수와 군역 부과</b>의 기초 자료를 마련하였다. 백성이 함부로 거주지를 떠나는 것을 막는 효과도 있었다.</p>` },

{ n:7,
  text:"단종을 내쫓고 왕위에 오른 {{세조}}는 집현전과 경연을 폐지하고 국왕에게 권력을 집중하였다.",
  exp:`<p>수양 대군은 1453년 계유정난으로 김종서 등을 제거하고 실권을 잡은 뒤, 1455년 단종을 몰아내고 <b>세조</b>로 즉위하였다.</p>
<p>집현전 출신 학자들(사육신)의 단종 복위 운동이 실패하자 <b>집현전을 폐지</b>하고, 왕과 신하가 학문과 정치를 논하던 <b>경연도 중단</b>하였다. 또한 6조 직계제를 다시 실시하여 왕권을 강화하였다.</p>` },

{ n:8,

/* 15번 조직도 빈칸 정의 */
const GROUPS = {
  A:["이조","호조","예조","병조","형조","공조"],
  B:["승정원","의금부","사헌부","사간원","홍문관","춘추관","성균관","한성부"]
};
const CHART_BLANKS = [
  {answers:["국왕"]},
  {answers:["의정부"]},
  {answers:["6조","육조"]},
  ...GROUPS.A.map(()=>({group:"A"})),
  ...GROUPS.B.map(()=>({group:"B"}))
];

/* ---------- 유틸 ---------- */
// 채점용 정규화: 띄어쓰기와 문장부호(마침표, 쉼표, 가운뎃점 등)를 무시
function norm(s){
  return (s||"").normalize("NFC").replace(/[\s.,·ㆍ・‧、，。]/g,"");
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function shuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function parse(text){
  const parts=[]; const re=/\{\{(.+?)\}\}/g; let last=0,m;
  while((m=re.exec(text))){
    if(m.index>last) parts.push({t:"text",v:text.slice(last,m.index)});
    parts.push({t:"blank",answers:m[1].split("|")});
    last=re.lastIndex;
  }
  if(last<text.length) parts.push({t:"text",v:text.slice(last)});
  return parts;
}
QUESTIONS.forEach(q=>{
  if(q.type==="chart"){ q.blanks=CHART_BLANKS; }
  else { q.parts=parse(q.text); q.blanks=q.parts.filter(p=>p.t==="blank"); }
});
const byN = Object.fromEntries(QUESTIONS.map(q=>[q.n,q]));

/* ---------- 채점 ---------- */
function grade(q, inputs){
  const res=q.blanks.map(()=>null);
  const pools={};
  q.blanks.forEach((b,i)=>{
    if(b.group) return;
    const ok=b.answers.some(a=>norm(a)===norm(inputs[i]));
    res[i]={ok, expected:b.answers[0]};
  });
  q.blanks.forEach((b,i)=>{
    if(!b.group) return;
    if(!pools[b.group]) pools[b.group]=GROUPS[b.group].slice();
    const pool=pools[b.group]; const v=norm(inputs[i]);
    const k=v?pool.findIndex(a=>norm(a)===v):-1;
    if(k>-1){ pool.splice(k,1); res[i]={ok:true}; } else res[i]={ok:false};
  });
  return {res, missing:pools, ok:res.every(r=>r.ok)};
}

/* ---------- 상태 ---------- */
const S = { order:[], cur:0, answers:{}, results:null, filter:"all" };
const $ = id=>document.getElementById(id);

function startRound(nums){
  S.order=shuffle(nums); S.cur=0;
  nums.forEach(n=>{ S.answers[n]=byN[n].blanks.map(()=> ""); });
  $("intro").hidden=true; $("result").hidden=true; $("quiz").hidden=false;
  renderQuestion(); window.scrollTo({top:0,behavior:"smooth"});
}

function isFilled(n){ return S.answers[n].every(v=>v.trim()!==""); }

function blankInput(b,i){
  const ref = b.answers ? b.answers[0] : GROUPS[b.group].reduce((m,a)=>a.length>m.length?a:m,"");
  const len=[...ref].length;
  const long=!b.group && len>14;
  const style = (long||b.group) ? "" : `style="width:${Math.max(4,len*1.05+1.4).toFixed(1)}em"`;
  return `<input class="blank${long?" long":""}" data-i="${i}" ${style} autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="빈칸 ${i+1}">`;
}

function chartHTML(cell){
  // cell(i) -> html for blank i
  const six=[3,4,5,6,7,8].map(i=>`<div>${cell(i)}</div>`).join("");
  const eight=[9,10,11,12,13,14,15,16].map(i=>`<div>${cell(i)}</div>`).join("");
  return `<div class="chart">
    <div class="root">${cell(0)}</div>
    <div class="stem"></div>
    <div class="branches">
      <div class="branch col">
        <div class="cap">합의 기구 · 행정 실무</div>
        <div class="node">${cell(1)}</div>
        <div class="stem"></div>
        <div class="node">${cell(2)}</div>
        <div class="stem"></div>
        <div class="cap" style="margin-bottom:8px">소속 기관 6곳 · 순서 무관</div>
        <div class="grid six">${six}</div>
      </div>
      <div class="branch">
        <div class="cap">국왕 직속 기구 8곳 · 순서 무관</div>
        <div class="grid eight">${eight}</div>
      </div>
    </div>
  </div>`;
}

function renderQuestion(){
  const n=S.order[S.cur], q=byN[n], total=S.order.length;
  let body;
  if(q.type==="chart"){
    body=`<p class="qtitle">조선의 중앙 정치 제도 조직도를 완성하세요.</p>`+chartHTML(i=>blankInput(q.blanks[i],i));
  }else{
    let bi=0;
    body=`<div class="qbody">`+q.parts.map(p=>p.t==="text"?esc(p.v):blankInput(p,bi++)).join("")+`</div>`;
  }
  const last=S.cur===total-1;
  const card=$("qcard");
  card.classList.remove("anim"); void card.offsetWidth; card.classList.add("anim");
  card.innerHTML=`
    <div class="qmeta">
      <span class="qcount">문제 ${S.cur+1} <em>/ ${total}</em></span>
      <span class="qtag">${q.type==="chart"?"조직도 · 빈칸 "+q.blanks.length+"개":"빈칸 "+q.blanks.length+"개"}</span>
    </div>
    ${body}
    <div class="nav">
      <button class="btn" id="prevBtn" ${S.cur===0?"disabled":""}>← 이전</button>
      ${last?`<button class="btn primary" id="submitBtn">제출하기</button>`:`<button class="btn primary" id="nextBtn">다음 →</button>`}
    </div>`;
  const inputs=[...card.querySelectorAll("input.blank")];
  inputs.forEach(el=>{
    const i=+el.dataset.i;
    el.value=S.answers[n][i];
    el.addEventListener("input",()=>{ S.answers[n][i]=el.value; updateProgress(); });
    el.addEventListener("keydown",e=>{
      if(e.key!=="Enter" || e.isComposing) return;
      e.preventDefault();
      const k=inputs.indexOf(el);
      if(k<inputs.length-1) inputs[k+1].focus();
      else if(!last) go(1);
      else $("submitBtn").focus();
    });
  });
  $("prevBtn").onclick=()=>go(-1);
  if(last) $("submitBtn").onclick=submit; else $("nextBtn").onclick=()=>go(1);
  updateProgress();
  const firstEmpty=inputs.find(el=>!el.value.trim())||inputs[0];
  if(firstEmpty && window.matchMedia("(pointer:fine)").matches) firstEmpty.focus({preventScroll:true});
}

function go(d){
  const k=S.cur+d;
  if(k<0||k>=S.order.length) return;
  S.cur=k; renderQuestion();
}

function updateProgress(){
  const total=S.order.length;
  const filled=S.order.filter(isFilled).length;
  $("barFill").style.width=(filled/total*100)+"%";
  $("progText").textContent=`${filled} / ${total} 작성`;
  $("dots").innerHTML=S.order.map((n,k)=>
    `<button class="dot${isFilled(n)?" filled":""}${k===S.cur?" cur":""}" data-k="${k}" aria-label="문제 ${k+1}">${k+1}</button>`
  ).join("")+`<span class="spacer"></span><button class="btn primary" id="submitTop">제출</button>`;
  $("dots").querySelectorAll(".dot").forEach(b=>b.onclick=()=>{S.cur=+b.dataset.k;renderQuestion();});
  $("submitTop").onclick=submit;
}

function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2400);
}

function submit(){
  const empty=S.order.map((n,k)=>({n,k})).filter(o=>!isFilled(o.n));
  if(empty.length){
    const cnt=empty.reduce((s,o)=>s+S.answers[o.n].filter(v=>!v.trim()).length,0);
    toast(`아직 비어 있는 빈칸이 ${cnt}개 있어요. (문제 ${empty.map(o=>o.k+1).join(", ")})`);
    S.cur=empty[0].k; renderQuestion();
    return;
  }
  S.results=S.order.slice().sort((a,b)=>a-b).map(n=>({n, ...grade(byN[n],S.answers[n])}));
  S.filter="all";
  renderResult();
}

/* ---------- 결과 ---------- */
function ansSpan(input,r){
  const v=input.trim();
  if(r.ok) return `<span class="ans ok">${esc(v)}</span>`;
  return `<span class="ans bad${v?"":" empty"}">${v?esc(v):"(빈칸)"}</span>`+(r.expected?`<span class="fix">${esc(r.expected)}</span>`:"");
}

function renderResult(){
  const R=S.results, total=R.length, right=R.filter(r=>r.ok).length;
  const blanksTotal=R.reduce((s,r)=>s+r.res.length,0);
  const blanksRight=R.reduce((s,r)=>s+r.res.filter(x=>x.ok).length,0);
  const score=Math.round(right/total*100);
  $("quiz").hidden=true; $("result").hidden=false;
  $("scoreNum").textContent=score;
  $("scoreTitle").textContent=score===100?"완벽해요!":score>=80?"아주 잘했어요":score>=60?"조금만 더 다듬어 봐요":"해설을 보며 다시 정리해 봐요";
  $("scoreSub").textContent=`${total}문항 중 ${right}문항 정답 · 빈칸 ${blanksRight} / ${blanksTotal}`;
  const C=326.73;
  $("ringArc").setAttribute("stroke-dashoffset",C);
  requestAnimationFrame(()=>requestAnimationFrame(()=>$("ringArc").setAttribute("stroke-dashoffset",(C*(1-score/100)).toFixed(2))));
  $("retryWrong").disabled = right===total;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.f===S.filter));
  renderList();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderList(){
  const list=S.results.filter(r=>S.filter==="all"||!r.ok);
  if(!list.length){ $("rlist").innerHTML=`<div class="card" style="text-align:center;color:var(--muted)">틀린 문제가 없어요.</div>`; return; }
  $("rlist").innerHTML=list.map(r=>{
    const q=byN[r.n], inp=S.answers[r.n];
    let body;
    if(q.type==="chart"){
      const cell=i=>{
        const x=r.res[i], v=inp[i].trim();
        return `<span class="chip ${x.ok?"ok":"bad"}">${v?esc(v):"(빈칸)"}${(!x.ok&&x.expected)?`<span class="exp">→ ${esc(x.expected)}</span>`:""}</span>`;
      };
      const miss=[];
      if(r.missing.A&&r.missing.A.length) miss.push(`6조 소속 중 빠진 답: <b>${r.missing.A.join(", ")}</b>`);
      if(r.missing.B&&r.missing.B.length) miss.push(`국왕 직속 기구 중 빠진 답: <b>${r.missing.B.join(", ")}</b>`);
      body=`<p class="qtitle" style="font-size:16px;margin-bottom:12px">조선의 중앙 정치 제도</p>`+chartHTML(cell)+
        (miss.length?`<div class="missing">${miss.join("<br>")}</div>`:"");
    }else{
      let bi=0;
      body=`<div class="rbody">`+q.parts.map(p=>{
        if(p.t==="text") return esc(p.v);
        const i=bi++; return ansSpan(inp[i],r.res[i]);
      }).join("")+`</div>`;
    }
    return `<article class="card ritem">
      <div class="rhead"><span class="rnum">${r.n}번</span><span class="badge ${r.ok?"ok":"bad"}">${r.ok?"정답":"오답"}</span></div>
      ${body}
      <details class="exp" open><summary>해설</summary><div class="expbody">${q.exp}</div></details>
    </article>`;
  }).join("");
}

/* ---------- 이벤트 ---------- */
$("startBtn").onclick=()=>startRound(QUESTIONS.map(q=>q.n));
$("retryAll").onclick=()=>startRound(QUESTIONS.map(q=>q.n));
$("retryWrong").onclick=()=>{
  const wrong=S.results.filter(r=>!r.ok).map(r=>r.n);
  if(wrong.length) startRound(wrong);
};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  S.filter=t.dataset.f;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
  renderList();
});
</script>
</body>
